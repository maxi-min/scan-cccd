name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (Vite + server)
        run: npm run build

      - name: Check repository secret GEMINI_API_KEY
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) {
            Write-Warning "Secret GEMINI_API_KEY chưa có hoặc rỗng."
            Write-Host "Hướng dẫn: repo Settings → Secrets and variables → Actions → New repository secret"
            Write-Host "Name phải đúng: GEMINI_API_KEY (không phải Environment secret nếu workflow không khai báo environment)"
          } else {
            Write-Host "GEMINI_API_KEY đã được cấu hình (độ dài: $($env:GEMINI_API_KEY.Length) ký tự)."
          }

      - name: Prepare bundled .env
        run: npm run prepare:env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}

      - name: Package Windows installer
        run: npm run pack:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
